<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELVION</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #050505;
    color: white;
    font-family: Arial, sans-serif;
    min-height: 100vh;
}

.container {
    max-width: 500px;
    margin: auto;
    padding: 20px;
    text-align: center;
}

.logo {
    font-size: 32px;
    font-weight: 900;
    letter-spacing: 4px;
    margin-top: 15px;
}

.user {
    margin-top: 8px;
    color: #aaa;
    font-size: 14px;
}

.balance {
    margin-top: 35px;
    font-size: 42px;
    font-weight: 900;
}

.coin {
    color: #aaa;
    font-size: 15px;
    letter-spacing: 2px;
}

.rate {
    margin-top: 8px;
    font-size: 15px;
    color: #aaa;
}

.energy-box {
    margin-top: 25px;
    background: #111;
    border-radius: 15px;
    padding: 15px;
}

.energy-text {
    display: flex;
    justify-content: space-between;
    color: #aaa;
    margin-bottom: 8px;
}

.energy-bar {
    width: 100%;
    height: 8px;
    background: #222;
    border-radius: 10px;
    overflow: hidden;
}

.energy-fill {
    height: 100%;
    width: 100%;
    background: white;
    transition: width .2s;
}

.tap {
    width: 210px;
    height: 210px;
    margin: 30px auto;
    border-radius: 50%;
    border: 2px solid #333;
    background: #101010;
    color: white;
    font-size: 32px;
    font-weight: 900;
    box-shadow: 0 0 35px rgba(255,255,255,.08);
}

.tap:active {
    transform: scale(.94);
}

.section {
    margin-top: 20px;
    background: #101010;
    border-radius: 18px;
    padding: 18px;
    text-align: left;
}

.section h3 {
    margin-top: 0;
}

button.action {
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    border: 0;
    border-radius: 12px;
    background: white;
    color: black;
    font-weight: bold;
}

button.action:disabled {
    opacity: .35;
}

.task {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #181818;
    padding: 12px;
    border-radius: 12px;
    margin-top: 10px;
}

.task button {
    border: 0;
    background: white;
    color: black;
    padding: 8px 12px;
    border-radius: 8px;
    font-weight: bold;
}

.status {
    margin-top: 15px;
    font-size: 13px;
    color: #777;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">ELVION</div>

    <div class="user" id="userName">
        Connecting Telegram...
    </div>

    <div class="balance" id="balance">
        0
    </div>

    <div class="coin">
        ELVION
    </div>

    <div class="rate">
        Mining rate: <span id="rate">1</span> ELVION / tap
    </div>

    <div class="energy-box">

        <div class="energy-text">
            <span>⚡ Energy</span>
            <span id="energy">2000 / 2000</span>
        </div>

        <div class="energy-bar">
            <div class="energy-fill" id="energyFill"></div>
        </div>

    </div>

    <button class="tap" id="tapButton">
        TAP
    </button>

    <div class="section">

        <h3>🎁 Daily Claim</h3>

        <p id="claimText">
            Claim your daily reward.
        </p>

        <button class="action" id="claimButton">
            CLAIM
        </button>

    </div>

    <div class="section">

        <h3>🚀 Boost</h3>

        <p>
            Double your mining rate permanently.
        </p>

        <p>
            Cost: <b>500,000 ELVION</b>
        </p>

        <button class="action" id="boostButton">
            BUY BOOST
        </button>

    </div>

    <div class="section">

        <h3>📋 Tasks</h3>

        <div class="task">
            <span>Follow us on X<br>+5,000</span>
            <button onclick="doTask('x')">OPEN</button>
        </div>

        <div class="task">
            <span>Join Telegram<br>+5,000</span>
            <button onclick="doTask('telegram')">OPEN</button>
        </div>

    </div>

    <div class="status" id="status">
        Connecting...
    </div>

</div>

<script>

const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();

const API = "";

let balance = 0;
let energy = 2000;
let maxEnergy = 2000;
let miningRate = 1;
let boosted = false;
let lastClaim = 0;

function initData() {
    return tg.initData || "";
}

async function api(url, method = "GET") {

    const options = {
        method: method,
        headers: {
            "Content-Type": "application/json"
        }
    };

    if (method !== "GET") {
        options.body = JSON.stringify({
            initData: initData()
        });
    }

    const response = await fetch(API + url, options);

    const data = await response.json();

    if (!response.ok) {
        throw new Error(data.error || "Request failed");
    }

    return data;
}

function formatNumber(number) {
    return Number(number).toLocaleString();
}

function updateUI() {

    document.getElementById("balance").textContent =
        formatNumber(balance);

    document.getElementById("energy").textContent =
        `${energy} / ${maxEnergy}`;

    document.getElementById("rate").textContent =
        miningRate;

    const percentage =
        Math.max(0, Math.min(100, (energy / maxEnergy) * 100));

    document.getElementById("energyFill").style.width =
        percentage + "%";

    if (boosted) {
        document.getElementById("boostButton").textContent =
            "BOOST ACTIVE";

        document.getElementById("boostButton").disabled =
            true;
    }
}

async function loadUser() {

    try {

        if (!initData()) {

            document.getElementById("status").textContent =
                "Open ELVION inside Telegram.";

            return;
        }

        const data = await api(
            "/api/user?initData=" +
            encodeURIComponent(initData())
        );

        balance = data.balance;
        energy = data.energy;
        maxEnergy = data.max_energy;
        miningRate = data.mining_rate;
        lastClaim = data.last_claim;
        boosted = data.boosted;

        const user = data.user;

        document.getElementById("userName").textContent =
            user.first_name || "ELVION User";

        document.getElementById("status").textContent =
            "ELVION is online.";

        updateUI();
        updateClaim();

    } catch (error) {

        document.getElementById("status").textContent =
            error.message;
    }
}

document.getElementById("tapButton").addEventListener(
    "click",
    async function () {

        if (energy <= 0) {
            return;
        }

        try {

            const data = await api(
                "/api/tap",
                "POST"
            );

            balance = data.balance;
            energy = data.energy;

            updateUI();

            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred("light");
            }

        } catch (error) {

            document.getElementById("status").textContent =
                error.message;
        }
    }
);

document.getElementById("claimButton").addEventListener(
    "click",
    async function () {

        try {

            const data = await api(
                "/api/claim",
                "POST"
            );

            balance = data.balance;
            lastClaim = data.last_claim;

            updateUI();
            updateClaim();

            alert(
                "+" +
                formatNumber(data.reward) +
                " ELVION claimed!"
            );

        } catch (error) {

            document.getElementById("status").textContent =
                error.message;

            updateClaim();
        }
    }
);

document.getElementById("boostButton").addEventListener(
    "click",
    async function () {

        if (!confirm(
            "Buy 2x mining boost for 500,000 ELVION?"
        )) {
            return;
        }

        try {

            const data = await api(
                "/api/boost",
                "POST"
            );

            balance = data.balance;
            miningRate = data.mining_rate;
            boosted = data.boosted;

            updateUI();

            alert("Boost activated!");

        } catch (error) {

            alert(error.message);
        }
    }
);

function updateClaim() {

    const button =
        document.getElementById("claimButton");

    const text =
        document.getElementById("claimText");

    if (!lastClaim) {

        button.disabled = false;
        text.textContent =
            "Your 24-hour reward is ready.";

        return;
    }

    const now =
        Math.floor(Date.now() / 1000);

    const remaining =
        (24 * 60 * 60) -
        (now - lastClaim);

    if (remaining <= 0) {

        button.disabled = false;
        text.textContent =
            "Your 24-hour reward is ready.";

        return;
    }

    button.disabled = true;

    const hours =
        Math.floor(remaining / 3600);

    const minutes =
        Math.floor((remaining % 3600) / 60);

    const seconds =
        remaining % 60;

    text.textContent =
        `Next claim in ${hours}h ${minutes}m ${seconds}s`;
}

function doTask(type) {

    if (type === "x") {

        window.open(
            "https://x.com/ABBANNURR4077",
            "_blank"
        );

    }

    if (type === "telegram") {

        window.open(
            "https://t.me/ABBANNURR1",
            "_blank"
        );
    }
}

setInterval(updateClaim, 1000);

setInterval(async function () {

    if (energy < maxEnergy) {

        try {

            const data = await api(
                "/api/user?initData=" +
                encodeURIComponent(initData())
            );

            balance = data.balance;
            energy = data.energy;

            updateUI();

        } catch (error) {}
    }

}, 5000);

loadUser();

</script>

</body>
</html>
